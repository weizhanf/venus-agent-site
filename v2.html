<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus V2 — 投资人版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050c1a;--bg2:#0a1628;--bg3:#0f1f38;
  --border:rgba(99,179,237,.15);
  --blue:#63b3ed;--purple:#b794f4;--green:#68d391;
  --red:#fc8181;--yellow:#f6e05e;
  --text:#e2e8f0;--muted:#718096;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;background:rgba(5,12,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem}
.nav-logo{font-size:.8rem;letter-spacing:.18em;color:var(--blue);font-weight:700}
.nav-logo span{color:var(--purple)}
.nav-right{display:flex;align-items:center;gap:1.5rem}
.nav-page{font-size:.8rem;color:var(--muted);letter-spacing:.05em}
.nav-back{font-size:.78rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:.25rem .8rem;border-radius:6px;transition:all .2s}
.nav-back:hover{color:var(--blue);border-color:var(--blue)}

/* SLIDER */
.slider{position:fixed;top:52px;left:0;right:0;bottom:0}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2rem;opacity:0;transform:translateY(60px);transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1);pointer-events:none;overflow-y:auto}
.slide.active{opacity:1;transform:translateY(0);pointer-events:all;z-index:1}
.slide.exit-up{opacity:0;transform:translateY(-60px);transition:opacity .4s,transform .4s}
.slide.exit-down{opacity:0;transform:translateY(60px);transition:opacity .4s,transform .4s}
.slide-inner{width:100%;max-width:1100px;margin:0 auto}

/* GRID BG */
.slide::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(99,179,237,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,179,237,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
.slide-inner{position:relative;z-index:1}

/* NAV DOTS */
.dots{position:fixed;right:1.8rem;top:50%;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:.6rem}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .3s;border:1px solid var(--muted)}
.dot.active{background:var(--blue);border-color:var(--blue);box-shadow:0 0 8px rgba(99,179,237,.6);transform:scale(1.4)}

/* ARROWS */
.arrow-btn{position:fixed;left:50%;transform:translateX(-50%);z-index:200;background:rgba(10,22,40,.8);border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:1rem}
.arrow-btn:hover{color:var(--blue);border-color:var(--blue)}
.arrow-up{top:62px}
.arrow-down{bottom:14px}

/* ── SLIDE 1: HERO ── */
.hero-center{text-align:center;display:flex;flex-direction:column;align-items:center}
.badge{display:inline-block;font-size:.68rem;letter-spacing:.2em;font-weight:700;color:var(--blue);background:rgba(99,179,237,.1);border:1px solid rgba(99,179,237,.3);padding:.28rem .85rem;border-radius:999px;margin-bottom:1.8rem;text-transform:uppercase}
h1{font-size:clamp(2.8rem,6vw,5rem);font-weight:800;line-height:1.12;letter-spacing:-.02em;margin-bottom:1rem}
.accent{background:linear-gradient(135deg,#63b3ed,#b794f4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:1.05rem;color:var(--muted);max-width:520px;margin:0 auto 3rem}
.hero-stats{display:flex;gap:4rem;justify-content:center;flex-wrap:wrap}
.hs{text-align:center}
.hs-num{font-size:3.2rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#63b3ed,#b794f4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hs-lbl{font-size:.78rem;color:var(--muted);margin-top:.3rem;letter-spacing:.05em}

/* ── SLIDE 2: KPI ── */
.slide-title{margin-bottom:2.5rem}
.stag{font-size:.68rem;letter-spacing:.2em;color:var(--purple);text-transform:uppercase;font-weight:700;margin-bottom:.5rem}
h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;margin-bottom:.4rem}
.sdesc{color:var(--muted);font-size:.9rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1.2rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.5rem;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:rgba(99,179,237,.3)}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#63b3ed,#b794f4);opacity:0;transition:.2s}
.card:hover::after{opacity:1}
.c-lbl{font-size:.72rem;color:var(--muted);letter-spacing:.07em;margin-bottom:.35rem;text-transform:uppercase}
.c-val{font-size:2rem;font-weight:800;line-height:1;margin-bottom:.35rem}
.blue{color:var(--blue)}.purple{color:var(--purple)}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}
.c-desc{font-size:.82rem;color:var(--muted)}
.compare{display:flex;align-items:center;gap:.4rem;margin-top:.6rem;font-size:.76rem}
.old{color:var(--red);text-decoration:line-through}
.new{color:var(--green);font-weight:600}

/* ── SLIDE 3: CHARTS ── */
.chart-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.5rem}
.chart-box h3{font-size:.9rem;font-weight:600;margin-bottom:1.2rem;color:var(--text)}
.chart-box canvas{max-height:220px}

/* ── SLIDE 4: PRIVACY PIPELINE ── */
.pipeline{display:flex;align-items:center;margin:1.5rem 0;flex-wrap:wrap;gap:.3rem}
.pnode{flex:1;min-width:100px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.9rem .8rem;text-align:center;transition:border-color .2s}
.pnode:hover{border-color:var(--blue)}
.pnode.danger{border-color:rgba(252,129,129,.35);background:rgba(252,129,129,.05)}
.pnode.safe{border-color:rgba(104,211,145,.35);background:rgba(104,211,145,.05)}
.pnode .icon{font-size:1.2rem;margin-bottom:.3rem}
.pnode .name{font-size:.75rem;font-weight:600}
.pnode .sub{font-size:.65rem;color:var(--muted);margin-top:.15rem}
.parr{color:var(--muted);font-size:.95rem;flex-shrink:0;padding:0 .2rem}

/* ── SLIDE 5: PII TABLE ── */
.pii-table{width:100%;border-collapse:collapse}
.pii-table th{font-size:.72rem;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border);padding:.55rem .9rem;text-align:left;text-transform:uppercase}
.pii-table td{padding:.75rem .9rem;border-bottom:1px solid rgba(99,179,237,.06);font-size:.84rem}
.pii-table tr:last-child td{border-bottom:none}
.pii-table tr:hover td{background:rgba(99,179,237,.025)}
.lvl{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.06em;padding:.15rem .45rem;border-radius:4px;text-transform:uppercase}
.lvl-block{background:rgba(252,129,129,.15);color:var(--red)}
.lvl-mask{background:rgba(246,224,94,.12);color:var(--yellow)}
.lvl-agg{background:rgba(99,179,237,.12);color:var(--blue)}
.lvl-pass{background:rgba(104,211,145,.12);color:var(--green)}

/* ── SLIDE 6: PROMPT ── */
.prompt-box{background:#060d1c;border:1px solid rgba(99,179,237,.2);border-radius:12px;padding:1.4rem 1.6rem;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:.78rem;line-height:1.75;color:#a0aec0;overflow-x:auto;white-space:pre}
.ck{color:var(--blue)}.cv{color:var(--green)}.cc{color:#4a5568}.cw{color:var(--red);font-weight:700}

/* ── SLIDE 7: FILES ── */
.files-table{width:100%;border-collapse:collapse}
.files-table th{font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--border);padding:.55rem .9rem;text-align:left;text-transform:uppercase;letter-spacing:.06em}
.files-table td{padding:.75rem .9rem;border-bottom:1px solid rgba(99,179,237,.06);font-size:.82rem;font-family:'SF Mono','Fira Code',monospace}
.files-table tr:last-child td{border-bottom:none}
.files-table tr:hover td{background:rgba(99,179,237,.025)}
.bar-w{width:100%;background:rgba(99,179,237,.08);border-radius:999px;height:5px;margin-top:.25rem}
.bar-f{height:5px;border-radius:999px;background:linear-gradient(90deg,#63b3ed,#b794f4)}
.dec{font-size:.68rem;font-weight:700;padding:.15rem .45rem;border-radius:4px;font-family:sans-serif;text-transform:uppercase}
.d-keep{background:rgba(104,211,145,.12);color:var(--green)}
.d-drop{background:rgba(252,129,129,.12);color:var(--red)}
.d-rewrite{background:rgba(246,224,94,.1);color:var(--yellow)}
.d-new{background:rgba(183,148,244,.12);color:var(--purple)}

/* ── SLIDE 8: TIMELINE ── */
.tl{position:relative;padding-left:2rem;display:grid;grid-template-columns:1fr 1fr;gap:0 2rem}
.tl::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 1.8rem 1.5rem}
.tl-dot{position:absolute;left:-1.95rem;top:.3rem;width:13px;height:13px;border-radius:50%;border:2px solid var(--border);background:var(--bg)}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(104,211,145,.5)}
.tl-item.active .tl-dot{background:var(--blue);border-color:var(--blue);box-shadow:0 0 10px rgba(99,179,237,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 5px rgba(99,179,237,.4)}50%{box-shadow
