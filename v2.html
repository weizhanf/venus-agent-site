<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus V2 — 投资人版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050c1a;--bg2:#0a1628;--bg3:#0f1f38;
  --border:rgba(99,179,237,.15);
  --blue:#63b3ed;--purple:#b794f4;--green:#68d391;
  --red:#fc8181;--yellow:#f6e05e;
  --text:#e2e8f0;--muted:#718096;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;line-height:1.6;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(5,12,26,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:.85rem;letter-spacing:.15em;color:var(--blue);font-weight:700}
.nav-logo span{color:var(--purple)}
.nav-back{font-size:.8rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:.3rem .9rem;border-radius:6px;transition:all .2s}
.nav-back:hover{color:var(--blue);border-color:var(--blue)}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 2rem 4rem;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(99,179,237,.08) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(183,148,244,.06) 0%,transparent 60%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(99,179,237,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,179,237,.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.badge{display:inline-block;font-size:.7rem;letter-spacing:.2em;font-weight:700;color:var(--blue);background:rgba(99,179,237,.1);border:1px solid rgba(99,179,237,.3);padding:.3rem .9rem;border-radius:999px;margin-bottom:1.5rem;text-transform:uppercase}
h1{font-size:clamp(2.4rem,6vw,4.5rem);font-weight:800;line-height:1.15;letter-spacing:-.02em;margin-bottom:1rem}
.accent{background:linear-gradient(135deg,#63b3ed,#b794f4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:1.1rem;color:var(--muted);max-width:560px;margin:0 auto 3rem}
.hero-stats{display:flex;gap:3rem;justify-content:center;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat .num{font-size:3rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#63b3ed,#b794f4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat .lbl{font-size:.8rem;color:var(--muted);margin-top:.3rem;letter-spacing:.05em}

/* SECTIONS */
.section{padding:5rem 2rem;max-width:1200px;margin:0 auto}
.section-tag{font-size:.7rem;letter-spacing:.2em;color:var(--purple);text-transform:uppercase;font-weight:700;margin-bottom:.5rem}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;margin-bottom:.5rem}
.section-desc{color:var(--muted);margin-bottom:2.5rem;max-width:560px}
.divider{border:none;border-top:1px solid var(--border);max-width:1200px;margin:0 auto}

/* CARDS */
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1.5rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:1.8rem;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(99,179,237,.35)}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#63b3ed,#b794f4);opacity:0;transition:opacity .2s}
.card:hover::after{opacity:1}
.card-lbl{font-size:.75rem;color:var(--muted);letter-spacing:.08em;margin-bottom:.4rem;text-transform:uppercase}
.card-val{font-size:2.2rem;font-weight:800;line-height:1;margin-bottom:.4rem}
.blue{color:var(--blue)}.purple{color:var(--purple)}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}
.card-desc{font-size:.85rem;color:var(--muted)}
.compare{display:flex;align-items:center;gap:.5rem;margin-top:.8rem;font-size:.78rem}
.old{color:var(--red);text-decoration:line-through}
.new{color:var(--green);font-weight:600}

/* CHARTS */
.chart-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2rem}
.chart-box h3{font-size:1rem;font-weight:600;margin-bottom:1.5rem;color:var(--text)}
.chart-box canvas{max-height:260px}

/* PIPELINE */
.pipeline{display:flex;align-items:stretch;gap:0;margin:2rem 0;flex-wrap:wrap}
.pipe-node{flex:1;min-width:110px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;transition:border-color .2s}
.pipe-node:hover{border-color:var(--blue)}
.pipe-node.danger{border-color:rgba(252,129,129,.3);background:rgba(252,129,129,.04)}
.pipe-node.safe{border-color:rgba(104,211,145,.3);background:rgba(104,211,145,.04)}
.pipe-icon{font-size:1.3rem;margin-bottom:.35rem}
.pipe-name{font-size:.78rem;font-weight:600}
.pipe-sub{font-size:.68rem;color:var(--muted);margin-top:.2rem}
.pipe-arr{display:flex;align-items:center;padding:0 .4rem;color:var(--muted);font-size:1rem;flex-shrink:0}

/* PII TABLE */
.pii-table{width:100%;border-collapse:collapse;margin-top:1.5rem}
.pii-table th{font-size:.75rem;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);padding:.6rem 1rem;text-align:left;text-transform:uppercase}
.pii-table td{padding:.85rem 1rem;border-bottom:1px solid rgba(99,179,237,.06);font-size:.87rem}
.pii-table tr:last-child td{border-bottom:none}
.pii-table tr:hover td{background:rgba(99,179,237,.03)}
.lvl{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:.18rem .5rem;border-radius:4px;text-transform:uppercase}
.lvl-block{background:rgba(252,129,129,.15);color:var(--red)}
.lvl-mask{background:rgba(246,224,94,.12);color:var(--yellow)}
.lvl-agg{background:rgba(99,179,237,.12);color:var(--blue)}
.lvl-pass{background:rgba(104,211,145,.12);color:var(--green)}
.arrow-cell{color:var(--muted);font-size:.9rem}

/* TIMELINE */
.tl{position:relative;padding-left:2rem}
.tl::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 2.2rem 1.5rem}
.tl-dot{position:absolute;left:-1.95rem;top:.3rem;width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--bg)}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(104,211,145,.5)}
.tl-item.active .tl-dot{background:var(--blue);border-color:var(--blue);box-shadow:0 0 12px rgba(99,179,237,.6);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(99,179,237,.4)}50%{box-shadow:0 0 18px rgba(99,179,237,.8)}}
.tl-day{font-size:.72rem;color:var(--muted);margin-bottom:.25rem;letter-spacing:.05em}
.tl-title{font-size:.95rem;font-weight:600;margin-bottom:.25rem}
.tl-desc{font-size:.83rem;color:var(--muted)}
.tag{display:inline-block;font-size:.65rem;font-weight:700;padding:.15rem .45rem;border-radius:4px;margin-left:.4rem;vertical-align:middle;text-transform:uppercase}
.tag-done{background:rgba(104,211,145,.15);color:var(--green)}
.tag-active{background:rgba(99,179,237,.15);color:var(--blue)}
.tag-pending{background:rgba(113,128,150,.1);color:var(--muted)}

/* PROMPT BOX */
.prompt-box{background:#0a0f1a;border:1px solid rgba(99,179,237,.2);border-radius:12px;padding:1.5rem 1.8rem;font-family:'SF Mono','Fira Code',monospace;font-size:.82rem;line-height:1.7;color:#a0aec0;overflow-x:auto;margin-top:1.5rem}
.prompt-box .c-key{color:var(--blue)}
.prompt-box .c-val{color:var(--green)}
.prompt-box .c-comment{color:#4a5568}
.prompt-box .c-warn{color:var(--red);font-weight:700}

/* FILES TABLE */
.files-table{width:100%;border-collapse:collapse}
.files-table th{font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--border);padding:.6rem 1rem;text-align:left;text-transform:uppercase;letter-spacing:.06em}
.files-table td{padding:.8rem 1rem;border-bottom:1px solid rgba(99,179,237,.06);font-size:.85rem;font-family:'SF Mono','Fira Code',monospace}
.files-table tr:last-child td{border-bottom:none}
.files-table tr:hover td{background:rgba(99,179,237,.03)}
.bar-wrap{width:100%;background:rgba(99,179,237,.08);border-radius:999px;height:6px;margin-top:.3rem}
.bar-fill{height:6px;border-radius:999px;background:linear-gradient(90deg,#63b3ed,#b794f4)}
.decision{font-size:.72rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;font-family:sans-serif}
.d-keep{background:rgba(104,211,145,.12);color:var(--green)}
.d-drop{background:rgba(252,129,129,.12);color:var(--red)}
.d-rewrite{background:rgba(246,224,94,.1);color:var(--yellow)}
.d-new{background:rgba(183,148,244,.12);color:var(--purple)}

footer{text-align:center;padding:3rem 2rem;border-top:1px solid var(--border);color:var(--muted);font-size:.8rem}

.fade-up{opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}
.fade-up.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">VENUS <span>V2</span> · MIGRATION BLUEPRINT</div>
  <a href="/" class="nav-back">← Back to V5</a>
</nav>

<!-- ═══ HERO ═══ -->
<div class="hero">
  <div class="badge">Investor Preview · April 2026</div>
  <h1>让 AI <span class="accent">断臂</span><br>保护企业数据主权</h1>
  <p class="hero-sub">Venus V2 将 LLM 调用从 4-5 次压缩到 0-1 次，Token 成本削减 84%，企业原始数据永不离境。</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">84%</div><div class="lbl">Token 成本
