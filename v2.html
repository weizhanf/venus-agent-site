<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus V2 — 迁移蓝图 · 投资人版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:       #050c1a;
    --bg2:      #0a1628;
    --bg3:      #0f1f38;
    --border:   rgba(99,179,237,0.15);
    --blue:     #63b3ed;
    --purple:   #b794f4;
    --green:    #68d391;
    --red:      #fc8181;
    --yellow:   #f6e05e;
    --text:     #e2e8f0;
    --muted:    #718096;
    --grad1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --grad2: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    --grad3: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(5,12,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-size: .85rem; letter-spacing: .15em; color: var(--blue); font-weight: 600; }
  .nav-logo span { color: var(--purple); }
  .nav-back {
    font-size: .8rem; color: var(--muted); text-decoration: none;
    border: 1px solid var(--border); padding: .3rem .8rem; border-radius: 6px;
    transition: all .2s;
  }
  .nav-back:hover { color: var(--blue); border-color: var(--blue); }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 6rem 2rem 4rem;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(99,179,237,.08) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(183,148,244,.06) 0%, transparent 60%);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99,179,237,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,179,237,.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .badge {
    display: inline-block;
    font-size: .7rem; letter-spacing: .2em; font-weight: 700;
    color: var(--blue); background: rgba(99,179,237,.1);
    border: 1px solid rgba(99,179,237,.3);
    padding: .3rem .9rem; border-radius: 999px; margin-bottom: 1.5rem;
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    font-weight: 800; line-height: 1.15;
    letter-spacing: -.02em; margin-bottom: 1rem;
  }
  h1 .accent { 
    background: linear-gradient(135deg, #63b3ed, #b794f4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    font-size: 1.1rem; color: var(--muted); max-width: 560px;
    margin: 0 auto 3rem;
  }
  .hero-stats {
    display: flex; gap: 3rem; justify-content: center; flex-wrap: wrap;
  }
  .hero-stat { text-align: center; }
  .hero-stat .num {
    font-size: 3rem; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #63b3ed, #b794f4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero-stat .label { font-size: .8rem; color: var(--muted); margin-top: .3rem; letter-spacing: .05em; }

  /* ── SECTION ── */
  section { padding: 5rem 2rem; max-width: 1200px; margin: 0 auto; }
  .section-tag {
    font-size: .7rem; letter-spacing: .2em; color: var(--purple);
    text-transform: uppercase; font-weight: 700; margin-bottom: .6rem;
  }
  h2 {
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 700; margin-bottom: .5rem;
  }
  .section-desc { color: var(--muted); margin-bottom: 3rem; max-width: 560px; }

  /* ── CARDS ── */
  .cards { display: grid; gap: 1.5rem; }
  .cards-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .cards-2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.8rem;
    position: relative; overflow: hidden;
    transition: transform .2s, border-color .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(99,179,237,.35); }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--grad1);
    opacity: 0; transition: opacity .2s;
  }
  .card:hover::before { opacity: 1; }
  .card.green::before  { background: var(--grad2); }
  .card.orange::before { background: var(--grad3); }

  .card-label { font-size: .75rem; color: var(--muted); letter-spacing: .08em; margin-bottom: .5rem; }
  .card-value { font-size: 2.2rem; font-weight: 800; line-height: 1; margin-bottom: .4rem; }
  .card-value.blue   { color: var(--blue); }
  .card-value.purple { color: var(--purple); }
  .card-value.green  { color: var(--green); }
  .card-value.red    { color: var(--red); }
  .card-desc { font-size: .85rem; color: var(--muted); }
  .card-compare {
    display: flex; align-items: center; gap: .5rem;
    margin-top: .8rem; font-size: .78rem;
  }
  .old { color: var(--red); text-decoration: line-through; }
  .arrow { color: var(--muted); }
  .new { color: var(--green); font-weight: 600; }

  /* ── CHARTS ── */
  .chart-wrap {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 16px; padding: 2rem;
  }
  .chart-title { font-size: 1rem; font-weight: 600; margin-bottom: 1.5rem; }
  .chart-wrap canvas { max-height: 280px; }

  /* ── PRIVACY PIPELINE ── */
  .pipeline {
    display: flex; align-items: center; gap: 0;
    flex-wrap: wrap; margin: 2rem 0;
  }
  .pipe-step {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem 1.2rem;
    text-align: center; min-width: 120px; flex: 1;
  }
  .pipe-step .icon { font-size: 1.4rem; margin-bottom: .4rem; }
  .pipe-step .name { font-size: .8rem; font-weight: 600; }
  .pipe-step .sub  { font-size: .7rem; color: var(--muted); margin-top: .2rem; }
  .pipe-step.danger { border-color: rgba(252,129,129,.3); background: rgba(252,129,129,.05); }
  .pipe-step.safe   { border-color: rgba(104,211,145,.3); background: rgba(104,211,145,.05); }
  .pipe-arrow { color: var(--muted); font-size: 1.2rem; padding: 0 .5rem; flex-shrink: 0; }

  /* ── PII TABLE ── */
  .pii-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
  .pii-table th {
    font-size: .75rem; letter-spacing: .08em; color: var(--muted);
    border-bottom: 1px solid var(--border); padding: .6rem 1rem; text-align: left;
  }
  .pii-table td { padding: .8rem 1rem; border-bottom: 1px solid rgba(99,179,237,.06); font-size: .88rem; }
  .pii-table tr:last-child td { border-bottom: none; }
  .level-badge {
    display: inline-block; font-size: .68rem; font-weight: 700;
    letter-spacing: .08em; padding: .2rem .55rem; border-radius: 5px;
  }
  .level-block  { background: rgba(252,129,129,.15); color: var(--red); }
  .level-mask   { background: rgba(246,224,94,.12);  color: var(--yellow); }
  .level-agg    { background: rgba(99,179,237,.12);  color: var(--blue); }
  .level-pass   { background: rgba(104,211,145,.12); color: var(--green); }

  /* ── TIMELINE ── */
  .timeline { position: relative; padding-left: 2rem; }
  .timeline::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px; background: var(--border);
  }
  .tl-item { position: relative; padding: 0 0 2.5rem 1.5rem; }
  .tl-dot {
    position: absolute; left: -2.4rem; top: .2rem;
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--bg);
    transition: all .3s;
  }
  .tl-item.done .tl-dot  { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(104,211,145,.5); }
  .tl-item.active .tl-dot{ background: var(--blue);  border-color: var(--blue);  box-shadow: 0 0 12px rgba(99,179,237,.6);  }
  .tl-day { font-size: .72rem; color: var(--muted); margin-bottom: .3rem; letter-spacing: .05em; }
  .tl-title { font-size: 1rem; font-weight: 600; margin-bottom: .3rem; }
  .tl-desc  { font-size: .85rem; color: var(--muted); }
  .tl-tag {
    display: inline-block; font-size: .68rem; font-weight: 700;
    padding: .15rem .5rem; border-radius: 4px; margin-left: .5rem;
    vertical-align: middle;
  }
  .tl-tag.done   { background: rgba(104,211,145,.15); color: var(--green); }
  .tl-tag.active { background: rgba(99,179,237,.15);  color: var(--blue);  }
  .tl-tag.pending{ background: rgba(113,128,150,.15); color: var(--muted); }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 3rem 2rem;
    border-top: 1px solid var(--border); color: var(--muted); font-size: .8rem;
  }

  /* ── SCROLL ANIMATION ── */
  .fade-up { opacity: 0; transform: translateY(24px); transition: opacity .6s, transform .6s; }
  .fade-up.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    .hero-stats { gap: 1.5rem; }
    .pipeline { gap: .5rem; }
    .pipe-arrow { display: none; }
  }
</style>
</head>
<body>

<nav>

</nav>
